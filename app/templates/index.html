<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFO AI Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-watermark"></div>

    <div class="logo-container">
        <img src="https://cfo.kgforum.kz/assets/about-cfo-logo-xOmTy2lM.webp" alt="CFO Summit Logo" class="main-logo">
    </div>

    <div class="main-terminal">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="terminal-body">
            <div class="avatar-section">
                <div class="avatar-frame" id="avatarFrame">
                    <video id="simli-video" poster="/static/avatar.png" autoplay playsinline></video>
                    <audio id="simli-audio" autoplay></audio>
                    <div class="live-badge">LIVE FEED ●</div>
                </div>

                <div class="controls">
                    <div id="status">SYSTEM READY</div>
                    <div class="controls-row">
                        <button id="connectBtn" class="primary-btn">INITIALIZE SESSION</button>
                        <button id="disconnectBtn" class="secondary-btn" disabled>TERMINATE</button>
                    </div>
                    <canvas id="audio-visualizer" width="500" height="40"></canvas>
                </div>
            </div>

            <div class="logs-section">
                <div class="logs-header">
                    <span class="tech-text">TRANSCRIPT PROTOCOL</span>
                    <span class="status-active">ACTIVE AWAITING DATA...</span>
                </div>
                <div id="logs" class="logs-content">
                    </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
