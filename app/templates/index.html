<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dos AI Assistant</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f0f0f0; }
        #controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #status { margin-bottom: 20px; font-weight: bold; }
        canvas { width: 100%; max-width: 600px; height: 100px; background: #333; border-radius: 8px; }
        #logs { width: 100%; max-width: 600px; height: 200px; overflow-y: auto; background: white; border: 1px solid #ccc; padding: 10px; margin-top: 20px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Dos AI Assistant</h1>

    <div id="controls">
        <button id="connectBtn" disabled>Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
    </div>

    <div id="status">Disconnected</div>

    <div id="avatar-container" style="position: relative; width: 400px; height: 400px; margin: 0 auto 20px auto;">
        <video id="simli-video" poster="/static/avatar.png" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <audio id="simli-audio" autoplay></audio>
    </div>

    <div id="logs"></div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
