<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFO AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="scanline"></div>

    <h1>
        <img src="https://cfo.kgforum.kz/assets/about-cfo-logo-xOmTy2lM.webp" alt="CFO Summit Logo" class="main-logo">
    </h1>

    <div class="main-terminal">
        <div class="avatar-section">
            <div class="avatar-frame" id="avatarFrame">
                <video id="simli-video" poster="/static/avatar.png" autoplay playsinline></video>
                <audio id="simli-audio" autoplay></audio>
            </div>

            <div class="controls">
                <div id="status">SYSTEM OFFLINE</div>
                
                <div class="controls-row">
                    <button id="connectBtn">START SESSION</button>
                    <button id="disconnectBtn" disabled>END SESSION</button>
                </div>
                
                <canvas id="audio-visualizer" width="500" height="60"></canvas>
            </div>
        </div>

        <div class="logs-section">
            <div class="logs-header">
                <span>TRANSCRIPT STREAM</span>
                <span>LIVE</span>
            </div>
            <div id="logs" class="logs-content">
                </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
