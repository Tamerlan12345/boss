<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dos AI Assistant - Neural Terminal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="scanline"></div>

    <h1>DOS :: NEURAL INTERFACE</h1>

    <div class="main-terminal">
        <!-- Left: Avatar & Controls -->
        <div class="avatar-section">
            <div class="avatar-frame" id="avatarFrame">
                <video id="simli-video" poster="/static/avatar.png" autoplay playsinline></video>
                <audio id="simli-audio" autoplay></audio>
            </div>

            <div class="controls">
                <div id="status">DISCONNECTED</div>
                <div class="controls-row">
                    <button id="connectBtn">Connect System</button>
                    <button id="disconnectBtn" disabled>Disconnect</button>
                </div>
                <!-- Visualizer placeholder -->
                <canvas id="audio-visualizer" width="500" height="60"></canvas>
            </div>
        </div>

        <!-- Right: Logs -->
        <div class="logs-section">
            <div class="logs-header">
                <span>NEURAL_LOG://STREAM_01</span>
                <span>STATUS: ACTIVE</span>
            </div>
            <div id="logs" class="logs-content">
                <!-- Log entries will appear here -->
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
